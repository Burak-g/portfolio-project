<!doctype html>
<html lang="da" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <script>
      try {
        const preference = localStorage.getItem('portfolio-theme');
        const dark = preference !== 'light';
        document.documentElement.classList.toggle('dark', dark);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#020617' : '#ffffff');
      } catch {}
    </script>
    <meta
      name="description"
      content="Burak Gültekins portfolio — softwareudvikling, digitale løsninger og digital marketing." />
    <title>Burak Gültekin | Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
